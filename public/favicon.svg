      <stop stop-color="#0F172A" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="16" y1="20" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" />
